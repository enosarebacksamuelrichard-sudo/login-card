<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome Back</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="phone">

        <!-- Back button -->
        <div class="back">‹</div>

        <!-- Heading -->
        <h1>Welcome Back!</h1>

        <p class="subtitle">Log in to continue</p>


        <!-- Email -->
        <label>Email or Phone Number</label>

        <input
            type="text"
            class="input"
            placeholder="Input Email"
        >


        <!-- Password -->
        <label>Password</label>

        <div class="password-box">

            <input
                type="password"
                class="input"
                placeholder="Input Password"
            >

            <span class="eye">◉</span>

        </div>


        <!-- Forgot password -->
        <div class="forgot">
            Forgot Password
        </div>


        <!-- Login button -->
        <button class="login-button">
            Login
        </button>


        <!-- Social login -->
        <section class="social">

            <h2>or continue with</h2>

            <div class="social-buttons">

                <!-- Google -->
                <button class="social-button">

    <svg class="google-logo"
         viewBox="0 0 48 48"
         xmlns="http://www.w3.org/2000/svg">

        <path fill="#EA4335"
              d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.61 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.05 17.74 9.5 24 9.5z"/>

        <path fill="#4285F4"
              d="M46.5 24.5c0-1.62-.15-3.18-.43-4.68H24v9.02h12.65c-.54 2.9-2.17 5.35-4.63 6.99l7.48 5.8C43.86 37.56 46.5 31.56 46.5 24.5z"/>

        <path fill="#FBBC05"
              d="M10.54 28.59A14.38 14.38 0 0 1 9.5 24c0-1.59.28-3.14.78-4.59l-7.98-6.19A23.96 23.96 0 0 0 0 24c0 3.87.93 7.53 2.56 10.78l7.98-6.19z"/>

        <path fill="#34A853"
              d="M24 48c6.48 0 11.91-2.14 15.87-5.83l-7.48-5.8c-2.08 1.4-4.73 2.23-8.39 2.23-6.26 0-11.57-3.55-13.46-9.91l-7.98 6.19C6.51 42.62 14.61 48 24 48z"/>

    </svg>

    <span>Google</span>

</button>

                <!-- Apple -->
                <button class="social-button">

    <svg class="apple-logo"
         viewBox="0 0 24 24"
         xmlns="http://www.w3.org/2000/svg">

        <path d="M18.71 19.5c-.83 1.24-1.71 2.47-3.09 2.5-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.34-3.14-2.58-1.71-2.47-3.02-7-1.26-10.05.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.27.87.77 0 2.22-1.08 3.75-.92.64.03 2.44.26 3.59 1.95-.09.06-2.14 1.24-2.12 3.68.03 2.93 2.57 3.9 2.6 3.91-.02.07-.4 1.36-1.31 2.7zM15.33 4.85c.7-.83 1.17-1.99 1.04-3.15-1.01.04-2.23.67-2.95 1.5-.64.73-1.2 1.9-1.05 3.03 1.12.09 2.26-.57 2.96-1.38z"
              fill="#000"/>

    </svg>

    <span>Apple</span>

</button>

            </div>

        </section>


        <!-- Register -->
        <p class="register">
            Don't have an account?
            <span>Register</span>
        </p>

    </main>

</body>

</html>
